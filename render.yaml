services:
  - type: web
    name: almadinah-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: almadinah-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_USERNAME
        value: admin
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: almadinah-postgres
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOW_DATABASE_RESTORE
        value: "false"

databases:
  - name: almadinah-postgres
    databaseName: mangment_almadinah
    user: almadinah_app
    plan: basic-1gb
    region: frankfurt
    postgresMajorVersion: "16"
