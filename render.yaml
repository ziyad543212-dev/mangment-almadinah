services:
  - type: web
    name: almadinah-backend
    env: node
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: almadinah-db
          property: connectionString

databases:
  - name: almadinah-db
    databaseName: almadinah
    user: almadinah_user
