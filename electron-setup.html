<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>إعداد الاتصال بقاعدة البيانات</title>
    <style>
      body { margin: 0; padding: 28px; color: #20243a; font: 15px "Segoe UI", Tahoma, sans-serif; background: #f5f6fa; }
      main { max-width: 520px; margin: 0 auto; padding: 28px; border-radius: 12px; background: #fff; box-shadow: 0 8px 30px #17213a16; }
      h1 { margin-top: 0; font-size: 22px; }
      p { line-height: 1.7; color: #586174; }
      label { display: block; margin-top: 18px; font-weight: 600; }
      input { box-sizing: border-box; width: 100%; margin-top: 8px; padding: 11px; border: 1px solid #cbd0dc; border-radius: 6px; font: 14px "Segoe UI", Tahoma, sans-serif; direction: ltr; text-align: left; }
      button { margin-top: 22px; padding: 11px 18px; border: 0; border-radius: 6px; color: #fff; background: #263d75; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      #status { min-height: 24px; color: #a12622; }
      .hint { font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>إعداد اتصال النظام</h1>
      <p>أدخل إعدادات PostgreSQL ومفتاح JWT مرة واحدة. تُحفظ الإعدادات مشفّرة في مجلد بيانات مستخدم Windows، ولا تُضمّن داخل التطبيق.</p>
      <form id="configuration-form">
        <label for="database-url">رابط PostgreSQL</label>
        <input id="database-url" name="databaseUrl" autocomplete="off" spellcheck="false" required placeholder="postgresql://user:password@host/database?sslmode=require">
        <p class="hint">لـ Neon استخدم رابط الاتصال الكامل الذي يتضمن sslmode=require.</p>
        <label for="jwt-secret">JWT Secret</label>
        <input id="jwt-secret" name="jwtSecret" type="password" autocomplete="new-password" required minlength="32">
        <p class="hint">يجب ألا يقل عن 32 حرفًا وأن يكون عشوائيًا. لا تعِد استخدام كلمة مرور قاعدة البيانات.</p>
        <button id="submit-button" type="submit">حفظ والاتصال</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="./electron-setup-renderer.js"></script>
  </body>
</html>
